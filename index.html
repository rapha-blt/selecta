<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sélecta</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --bg: #ffffff; --accent: #6a4cf5; }
    @media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --accent: #9d8bff; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 34px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.button { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Sélecta</h1>
    <p>Une barre d'actions quand vous sélectionnez du texte sur votre Mac. macOS 14 ou plus récent.</p>
    <a class="button" href="https://github.com/rapha-blt/selecta/releases/latest">Télécharger la dernière version</a>
  </main>
</body>
</html>
